<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" role="img" aria-label="Risk data flowing from Databricks into linked controls, risks and cases in ServiceNow, then to an LLM that recommends mitigation actions">
  <style>
    text { font-family: Rubik, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .box { fill: rgba(45,212,191,.10); stroke: rgba(45,212,191,.45); }
    .out { fill: rgba(98,216,78,.12); stroke: rgba(98,216,78,.55); }
    .panel { fill: rgba(255,255,255,.04); stroke: rgba(255,255,255,.18); stroke-dasharray: 3 5; }
    .lbl { fill: #e6f4f1; font-size: 13px; font-weight: 600; }
    .sub { fill: #9fc3c9; font-size: 10.5px; }
    .flow { fill: none; stroke-width: 1.6; stroke-dasharray: 5 7; animation: dash 1.6s linear infinite; }
    .in { stroke: #2dd4bf; opacity: .8; }
    .o { stroke: #62d84e; opacity: .85; }
    .link { stroke: #62d84e; stroke-width: 1.6; stroke-dasharray: 4 6; opacity: .7; animation: dash 2.2s linear infinite; }
    .node { fill: #032d42; stroke: #62d84e; stroke-width: 2; }
    .halo { fill: #62d84e; opacity: .18; transform-box: fill-box; transform-origin: center; animation: breathe 3s ease-in-out infinite; }
    .h2 { animation-delay: 1s; } .h3 { animation-delay: 2s; }
    .nl { fill: #ffffff; font-size: 11.5px; font-weight: 600; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes breathe { 0%, 100% { transform: scale(.85); opacity: .12; } 50% { transform: scale(1.25); opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect class="box" x="8" y="92" width="122" height="66" rx="10"/>
  <text class="lbl" x="69" y="121" text-anchor="middle">Databricks</text>
  <text class="sub" x="69" y="139" text-anchor="middle">risk &amp; control data</text>

  <path id="p1" class="flow in" d="M130 125 L186 125"/>
  <text class="sub" x="158" y="115" text-anchor="middle">REST</text>
  <circle r="3" fill="#b8fff0"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>

  <rect class="panel" x="186" y="14" width="200" height="222" rx="14"/>
  <text class="sub" x="286" y="226" text-anchor="middle" style="letter-spacing:1.5px">SERVICENOW · IRM</text>
  <line class="link" x1="286" y1="70" x2="236" y2="160"/>
  <line class="link" x1="286" y1="70" x2="336" y2="160"/>
  <line class="link" x1="236" y1="160" x2="336" y2="160"/>
  <circle class="halo" cx="286" cy="70" r="36"/><circle class="node" cx="286" cy="70" r="29"/><text class="nl" x="286" y="74" text-anchor="middle">Controls</text>
  <circle class="halo h2" cx="236" cy="160" r="36"/><circle class="node" cx="236" cy="160" r="29"/><text class="nl" x="236" y="164" text-anchor="middle">Risks</text>
  <circle class="halo h3" cx="336" cy="160" r="36"/><circle class="node" cx="336" cy="160" r="29"/><text class="nl" x="336" y="164" text-anchor="middle">Cases</text>

  <path id="p2" class="flow o" d="M386 125 L430 125"/>
  <circle r="3" fill="#d7ffd0"><animateMotion dur="1.4s" begin=".7s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>

  <rect class="out" x="430" y="92" width="122" height="66" rx="10"/>
  <text class="lbl" x="491" y="121" text-anchor="middle">LLM analysis</text>
  <text class="sub" x="491" y="139" text-anchor="middle">mitigation actions</text>
</svg>
